version: "3.9"

services:
  redis:
    image: redis:7
    container_name: job_queue_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: job_queue_postgres
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      - "5432:5432"